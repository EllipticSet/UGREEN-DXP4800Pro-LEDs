name: Build and validate kernel compatibility
on:
  push:
    branches: ['compatibility/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/compatibility/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 make bc bison flex libssl-dev libelf-dev kmod jq php-cli
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
      - name: Compile rebuilt modules against the pinned Unraid kernels
        run: |
          python3 tests/module-source-test.py
          patch_sha=$(sha256sum vendor/led-ugreen-hardening.patch | cut -d ' ' -f1)
          kernels=$(python3 -I -c 'import sys; sys.path.insert(0, "build"); from package_manifest import REBUILT_KERNELS; print(" ".join(REBUILT_KERNELS))')
          for kernel in $kernels; do
            module_dir="vendor/modules/$kernel"
            if [ ! -f "$module_dir/led-ugreen.ko" ] || ! grep -qx "led_patch_sha256=$patch_sha" "$module_dir/BUILD_INFO"; then
              curl --fail --location --retry 3 "https://github.com/ich777/unraid_kernel/releases/download/$kernel/linux-$kernel.tar.xz" -o "$RUNNER_TEMP/kernel.tar.xz"
              bash build/build-module.sh "$RUNNER_TEMP/kernel.tar.xz" "$kernel" "$module_dir"
            fi
            (cd "$module_dir" && sha256sum -c led-ugreen.ko.sha256)
            test "$(modinfo -F vermagic "$module_dir/led-ugreen.ko" | cut -d ' ' -f1)" = "$kernel"
          done
      - name: Build and validate all modules and plugin regressions
        run: |
          bash -n src/ugreen-pro-leds
          for file in src/*.sh build/*.sh; do bash -n "$file"; done
          for file in src/web/*.php; do php -l "$file"; done
          php tests/settings-test.php
          php tests/tab-settings-test.php
          node tests/mapping-guide-test.js
          node tests/led-preview-test.js
          node tests/color-picker-test.js
          php tests/settings-recovery-test.php
          php tests/csrf-test.php
          php tests/native-csrf-test.php
          bash tests/monitor-test.sh
          bash tests/network-disk-test.sh
          python3 tests/preflight-test.py
          python3 tests/install-update-test.py
          python3 tests/uninstall-test.py
          python3 build/package.py
          python3 tests/package-test.py
          python3 tests/ca-metadata-test.py
          python3 tests/reproducible-package-test.py
      - name: Save verified module and offline package on the preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/modules src/web/version.txt UGREEN-DXP4800Pro-LEDs.plg UGREEN-DXP4800Pro-LEDs.plg.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify rebuilt LED modules and plugin package'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-compatibility-plugin
          path: |
            UGREEN-DXP4800Pro-LEDs.plg
            UGREEN-DXP4800Pro-LEDs.plg.sha256
