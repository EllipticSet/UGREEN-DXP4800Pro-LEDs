name: Validate plugin
on:
  push:
    branches-ignore:
      - "release-build/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell and PHP syntax
        run: |
          bash -n src/ugreen-pro-leds
          for file in src/*.sh build/*.sh; do bash -n "$file"; done
          for file in src/web/*.php; do php -l "$file"; done
      - name: Settings and native CSRF regression
        run: |
          php tests/settings-test.php
          php tests/tab-settings-test.php
          node tests/mapping-guide-test.js
          php tests/settings-recovery-test.php
          php tests/csrf-test.php
          php tests/native-csrf-test.php
      - name: Monitor and installer regression
        run: |
          python3 tests/module-source-test.py
          bash tests/monitor-test.sh
          bash tests/network-disk-test.sh
          python3 tests/preflight-test.py
          python3 tests/install-update-test.py
          python3 tests/uninstall-test.py
      - name: Verify committed package and CA metadata
        run: |
          python3 tests/package-test.py
          python3 tests/ca-metadata-test.py
      - name: Rebuild without changing committed artifacts
        run: |
          python3 build/package.py --no-publish
          python3 tests/package-test.py dist/UGREEN-DXP4800Pro-LEDs.plg
          python3 tests/reproducible-package-test.py
